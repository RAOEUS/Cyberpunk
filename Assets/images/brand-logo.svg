<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" height="30">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6fff"/>
      <stop offset="100%" stop-color="#b8a4ff"/>
    </linearGradient>
  </defs>
  <!-- Outer circle — uses currentColor so it adapts to theme -->
  <circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
  <!-- Inner filled circle — accent gradient -->
  <circle cx="18" cy="18" r="10" fill="url(#g)"/>
  <!-- Highlight -->
  <circle cx="14.5" cy="14.5" r="4" fill="rgba(255,255,255,0.25)"/>
  <!-- Small dot accent -->
  <circle cx="22" cy="22" r="1.5" fill="rgba(255,255,255,0.15)"/>
</svg>
